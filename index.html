<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="リヴァイ">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>リヴァイ</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --line: #e3e0da;
  --text: #1c1d1f; --sub: #6b6d72; --muted: #9a9ca1;
  --family: #2e8b57; --work: #1f7fa8; --union: #c8503c; --other: #7a7d85;
  --warn: #c77700; --calm: #2e8b57; --hot: #c8503c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --card: #191e24; --line: #2a3038;
    --text: #eef0f3; --sub: #a3a9b2; --muted: #6f7680;
    --family: #5cc98a; --work: #5bb6dc; --union: #ec7d68; --other: #9aa0aa;
    --warn: #f0a63a; --calm: #5cc98a; --hot: #ec7d68;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%; overflow: hidden; }
#pages { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; overscroll-behavior-x: contain; }
#pages::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; height: 100%; scroll-snap-align: start; overflow-y: auto;
  padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 60px); }
.head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.head h1 { font-size: 15px; font-weight: 600; color: var(--sub); letter-spacing: .05em; }
.head .clock { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.big { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 6px 0 4px; }
.mid { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 4px 0; }
.note { font-size: 14px; color: var(--sub); line-height: 1.6; }
.count { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 6px 0; }
.cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; vertical-align: middle; margin-right: 6px; }
.c-family { background: var(--family); } .c-work { background: var(--work); }
.c-union { background: var(--union); } .c-other { background: var(--other); }
.t-family { color: var(--family); } .t-work { color: var(--work); } .t-union { color: var(--union); }
.link { font-size: 14px; color: var(--sub); text-align: right; padding: 6px 4px; }
.allday { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
.wx { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
.wxline { font-size: 15px; line-height: 1.6; }
.wxline + .wxline { margin-top: 4px; }
.rain { color: var(--work); font-weight: 600; }
.river { position: relative; margin-left: 52px; border-left: 2px solid var(--line); padding-left: 14px; }
.ev, .gap, .nowline { position: relative; margin: 8px 0; }
.ev .time, .gap .time { position: absolute; left: -68px; width: 48px; text-align: right; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; top: 12px; }
.ev .box { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--other); border-radius: 12px; padding: 10px 12px; }
.ev.family .box { border-left-color: var(--family); } .ev.work .box { border-left-color: var(--work); }
.ev.union .box { border-left-color: var(--union); } .ev.past { opacity: .45; }
.ev.family .box .ttl { font-weight: 700; }
.ev .ttl { font-size: 15px; } .ev .sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
.gap .box { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; color: var(--sub); font-size: 14px; }
.gap .box b { color: var(--text); }
.nowline { height: 0; border-top: 2px solid var(--hot); margin: 10px 0 10px -22px; }
.nowline::before { content: "いま"; position: absolute; left: -46px; top: -9px; font-size: 11px; color: var(--hot); font-weight: 700; }
.dl { margin-bottom: 18px; }
.dl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dl .name { font-weight: 700; }
.dl .left { font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--line); margin: 8px 0 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
#dots { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; justify-content: center; gap: 8px; pointer-events: none; }
#dots span { width: 7px; height: 7px; border-radius: 99px; background: var(--line); transition: all .2s; }
#dots span.on { background: var(--sub); width: 20px; }
#banner { display: none; font-size: 12px; color: var(--warn); margin-bottom: 10px; }
#gear { background: none; border: 0; color: var(--muted); font-size: 18px; }
#setup { display: none; position: fixed; inset: 0; background: var(--bg); padding: calc(env(safe-area-inset-top) + 24px) 20px; z-index: 5; }
#setup input { width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin: 6px 0 14px; }
#setup button { font-size: 16px; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--text); color: var(--bg); margin-right: 8px; }
#plus { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 34px); width: 56px; height: 56px; border-radius: 99px; border: 0;
  background: var(--text); color: var(--bg); font-size: 30px; line-height: 56px; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 3; }
#add { display: none; position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 6;
  padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 30px); }
#inText { width: 100%; min-height: 84px; font-size: 17px; padding: 12px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-family: inherit; margin: 8px 0 10px; }
.btn { font-size: 16px; padding: 11px 18px; border-radius: 12px; border: 0; background: var(--text); color: var(--bg); margin: 10px 8px 0 0; font-family: inherit; }
.btn.ghost { background: var(--line); color: var(--text); }
.btn:disabled { opacity: .35; }
.draft .f { width: 100%; font-size: 17px; font-weight: 700; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); margin: 8px 0 2px; font-family: inherit; }
.draft .f.sm { width: auto; font-size: 15px; font-weight: 400; padding: 6px 8px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; padding: 4px; border-radius: 12px; font-size: 14px; color: var(--sub); }
.ask { background: color-mix(in srgb, var(--warn) 16%, transparent); outline: 1.5px solid var(--warn); }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-family: inherit; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.cc-family.on { background: var(--family); border-color: var(--family); color: #fff; }
.chip.cc-work.on { background: var(--work); border-color: var(--work); color: #fff; }
.chip.cc-union.on { background: var(--union); border-color: var(--union); color: #fff; }
.draft .link span { text-decoration: underline; }
/* 月の暦（サブ画面） */
.calbtn { background: none; border: 0; color: var(--sub); font-size: 17px; font-family: inherit; padding: 0 2px; }
#cal { display: none; position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 4;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 30px); }
#cal .kf { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
#cal .kchip { font: inherit; font-size: 14px; padding: 6px 12px 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
#cal .kchip[aria-pressed="false"] { opacity: .4; }
#cal .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
#cal .family { --c: var(--family); } #cal .work { --c: var(--work); } #cal .union { --c: var(--union); } #cal .other { --c: var(--other); }
#cal h2 { font-size: 13px; letter-spacing: .12em; color: var(--sub); margin: 4px 0 8px; font-weight: 600; }
#cal .hz { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scroll-snap-type: x proximity; }
#cal .hz .kd { flex: 0 0 auto; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 130px; max-width: 200px; }
#cal .hz .kd.near { border-color: var(--hot); }
#cal .hz .n { font-weight: 700; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
#cal .hz .n small { font-size: 13px; font-weight: 500; color: var(--sub); margin-left: 2px; }
#cal .hz .w { font-size: 12px; color: var(--sub); }
#cal .hz .t { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#cal .mtabs { display: flex; gap: 6px; overflow-x: auto; position: sticky; top: calc(-18px - env(safe-area-inset-top)); background: var(--bg); padding: 8px 0; z-index: 1; }
#cal .mtab { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--text); white-space: nowrap; }
#cal .mtab .c { font-size: 11px; color: var(--muted); margin-left: 4px; }
#cal .month { margin: 14px 0 26px; scroll-margin-top: 56px; }
#cal .mhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
#cal .mhead h3 { font-size: 20px; } #cal .mhead span { color: var(--sub); font-size: 13px; }
#cal .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
#cal .dow { font-size: 11px; color: var(--muted); text-align: center; }
#cal .dow.sun, #cal .day.sun .num { color: var(--hot); } #cal .dow.sat, #cal .day.sat .num { color: var(--work); }
#cal .day { font: inherit; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-height: 58px; padding: 4px; display: flex; flex-direction: column; gap: 3px; color: var(--text); min-width: 0; }
#cal .day.out { visibility: hidden; } #cal .day.rest { background: var(--line); } #cal .day.past { opacity: .45; }
#cal .day .num { font-size: 12px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
#cal .day.today { border: 2px solid var(--text); }
#cal .day.today .num b { background: var(--text); color: var(--bg); border-radius: 99px; padding: 0 5px; }
#cal .day.sel { box-shadow: 0 0 0 2px var(--warn) inset; }
#cal .flag { font-size: 10px; font-weight: 700; color: #fff; background: var(--hot); border-radius: 4px; padding: 0 3px; line-height: 1.4; }
#cal .dots { display: flex; flex-wrap: wrap; gap: 3px; }
#cal .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--c); } #cal .dot.family { width: 9px; height: 9px; }
#cal .det { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
#cal .det h4 { font-size: 16px; margin-bottom: 8px; }
#cal .det li { list-style: none; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; padding: 4px 0; }
#cal .det .tm { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
#cal .det .tt { border-left: 3px solid var(--c); padding-left: 8px; overflow-wrap: anywhere; }
#cal .det .tt.family { font-weight: 600; }
#toast { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 100px); z-index: 9;
  background: var(--text); color: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
/* 暦：スマホは日ごとの一覧、広い画面は月の暦（予定名つき） */
#cal .chipsx { display: none; flex-direction: column; gap: 2px; min-width: 0; }
#cal .evx { font-size: 11px; line-height: 1.3; padding: 1px 4px; border-radius: 4px; border-left: 3px solid var(--c); background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cal .evx.family { font-weight: 600; }
#cal .more { font-size: 11px; color: var(--sub); }
#cal .addday { font: inherit; font-size: 14px; margin-top: 10px; padding: 8px 14px; border-radius: 99px; border: 1px dashed var(--sub); background: none; color: var(--text); }
#cal .agenda { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
#cal .aday { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
#cal .aday:first-child { border-top: 0; }
#cal .aday.rest { background: var(--line); }
#cal .aday.today { box-shadow: inset 4px 0 0 var(--text); }
#cal .adate { font: inherit; background: none; border: 0; color: var(--text); display: grid; justify-items: center; align-content: start; line-height: 1.1; font-variant-numeric: tabular-nums; padding: 2px 0; }
#cal .adate b { font-size: 20px; } #cal .adate span { font-size: 12px; color: var(--sub); }
#cal .adate .plus { font-size: 12px; color: var(--muted); margin-top: 2px; }
#cal .aday.sun .adate b { color: var(--hot); } #cal .aday.sat .adate b { color: var(--work); }
#cal .adate .flag { margin-top: 4px; }
#cal .aevs { display: grid; gap: 6px; min-width: 0; align-content: center; }
#cal .aev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.4; }
#cal .aev .tm { font-size: 12px; color: var(--sub); padding-top: 2px; font-variant-numeric: tabular-nums; }
#cal .aev .tt { border-left: 3px solid var(--c); padding-left: 8px; overflow-wrap: anywhere; }
#cal .aev .tt.family { font-weight: 600; }
#cal .aev .tt.dlx { color: var(--hot); font-weight: 700; border-left-color: var(--hot); }
#cal .aday.empty { padding: 4px 12px; } #cal .aday.empty .adate b { font-size: 15px; color: var(--muted); }
#cal .aday.empty .aevs { color: var(--muted); font-size: 12px; }
@media (max-width: 759px) { #cal .grid, #cal .det { display: none; } #cal .agenda { display: grid; } }
@media (min-width: 760px) { #cal .day { min-height: 96px; padding: 6px; } #cal .dots { display: none; } #cal .chipsx { display: flex; } }
[data-id] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.pressing { transform: scale(.97); transition: transform .3s; }
</style>
</head>
<body>
<div id="pages">
  <section class="page" id="pA">
    <div class="head"><h1>いま</h1><span><span class="clock" id="clock"></span> <button class="calbtn" aria-label="月の暦">🗓</button> <button id="gear" aria-label="設定">⚙︎</button></span></div>
    <div id="banner"></div>
    <div id="A"></div>
  </section>
  <section class="page" id="pB">
    <div class="head"><h1>今日の時間の川</h1><span><span class="clock" id="dateB"></span> <button class="calbtn" aria-label="月の暦">🗓</button></span></div>
    <div id="B"></div>
  </section>
  <section class="page" id="pC">
    <div class="head"><h1>締切の地平線</h1><button class="calbtn" aria-label="月の暦">🗓 暦</button></div>
    <div id="C"></div>
  </section>
</div>
<div id="dots"><span class="on"></span><span></span><span></span></div>

<button id="plus" aria-label="予定を入れる">＋</button>
<div id="toast" role="status"></div>
<div id="add">
  <div class="head"><h1 id="addTitle">予定を入れる</h1><button id="addClose" class="btn ghost" style="margin:0;padding:6px 14px">閉じる</button></div>
  <p class="note" id="addHint">一言でどうぞ。何行でも入れられます。<br>例：10/27までに初任研指導報告書修正　／　明日18時 みゆ迎え　／　来週火曜16:45 分会会議</p>
  <p class="note" id="addPreset" style="display:none;margin-top:10px;color:var(--text)"></p>
  <textarea id="inText" placeholder="なにを・いつ"></textarea>
  <button id="read" class="btn">読む</button>
  <div id="drafts" style="margin-top:16px"></div>
</div>

<div id="cal">
  <div class="head"><h1>月の暦</h1><button id="calClose" class="btn ghost" style="margin:0;padding:6px 14px">閉じる</button></div>
  <div class="kf" id="calF"></div>
  <h2>締切の地平線</h2><div class="hz" id="calH"></div>
  <nav class="mtabs" id="calT"></nav>
  <div id="calM"></div>
  <p class="note" style="font-size:12px">日付を押すと、その日に予定を入れられます。予定を長押しすると直せます。</p>
</div>

<div id="setup">
  <div class="mid">リヴァイの設定</div>
  <p class="note" style="margin-bottom:16px">Apps ScriptのウェブアプリURLと合言葉を入れてください。この端末の中だけに保存します。</p>
  <label class="label">ウェブアプリのURL</label>
  <input id="inUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="label">合言葉</label>
  <input id="inKey" type="text" autocomplete="off">
  <button id="save">保存</button><button id="cancel" style="background:var(--line);color:var(--text)">閉じる</button>
</div>

<script>
// ---------- 設定 ----------
const CAT_PREFIX = { '【家族】': 'family', '【仕事】': 'work', '【組合】': 'union' };
const CAT_COLOR = { '10': 'family', '7': 'work', '11': 'union' };
const CAT_PREFIX_OF = { family: '【家族】', work: '【仕事】', union: '【組合】' };
const CAT_NAME = { family: '家族', work: '仕事', union: '組合', other: 'その他' };
const DEADLINE_RE = /締切|締め切り|〆切|しめきり|提出|期限|〆/;
const WRAP_UP_MIN = 5;          // 予定の何分前に切り上げるか
const DAY_START = 6, DAY_END = 22;
const MIN_GAP = 15;             // これより短いすき間は出さない（分）

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// URLの#u=…&k=… で渡されたら保存する（ショートカットから開く用）
(function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('u') && p.get('k')) {
    store.set('levi_url', p.get('u')); store.set('levi_key', p.get('k'));
    history.replaceState(null, '', location.pathname);
  }
})();

// ---------- 道具 ----------
const pad = n => String(n).padStart(2, '0');
const hm = d => `${d.getHours()}:${pad(d.getMinutes())}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
function dur(min) {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return h ? (m ? `${h}時間${m}分` : `${h}時間`) : `${m}分`;
}
function shape(raw) {
  let title = raw.title || '(無題)', cat = 'other';
  for (const p in CAT_PREFIX) if (title.startsWith(p)) { cat = CAT_PREFIX[p]; title = title.slice(p.length).trim(); }
  if (cat === 'other' && CAT_COLOR[raw.color]) cat = CAT_COLOR[raw.color];
  return { id: raw.id || '', title, cat, start: new Date(raw.start), end: new Date(raw.end), allDay: !!raw.allDay,
    location: raw.location || '', desc: raw.desc || '', deadline: DEADLINE_RE.test(title) && !title.startsWith('▶') };
}
const badge = c => `<span class="cat c-${c}">${CAT_NAME[c]}</span>`;

// ---------- A「いま」 ----------
function renderA(evs, now) {
  const today = evs.filter(e => !e.allDay && sameDay(e.start, now));
  const current = today.find(e => e.start <= now && now < e.end);
  const next = evs.filter(e => !e.allDay && e.start > now).sort((a, b) => a.start - b.start)[0];
  const deadlines = evs.filter(e => e.deadline && e.end > now).sort((a, b) => a.start - b.start);
  let html = '';

  // 今やること
  let doNow, doNote, doId = '';
  const todayDo = today.filter(e => isDo(e) && e.start > now).sort((a, b) => a.start - b.start)[0];
  if (current) {
    doId = current.id; doNow = doName(current); doNote = `${hm(current.end)}まで（あと${dur((current.end - now) / 6e4)}）`;
    if (stageOf(current)) doNote = `とりあえずここまで：${esc(stageOf(current))}<br>${doNote}`;
  } else if (now.getHours() >= 21 || now.getHours() < 5) {
    // 夜は進めさせない。明日の最初の約束だけ伝える
    doNow = '今日はおしまい';
    doNote = next && !sameDay(next.start, now) ? `明日は${hm(next.start)}「${esc(next.title)}」から` : 'ゆっくり休む';
  } else if (next && isDo(next) && (next.start - now) / 6e4 <= 180) {
    doId = next.id; doNow = `${hm(next.start)}から「${doName(next)}」`;
    doNote = `${dur((next.end - next.start) / 6e4)}。とりあえずここまで：${esc(stageOf(next) || '手をつける')}`;
  } else if (next && (next.start - now) / 6e4 <= 180) {
    doNow = `「${next.title}」の準備`;
    doNote = next.location ? `場所：${esc(next.location)}` : 'とりあえず、持ち物と移動を確かめる';
  } else if (todayDo) {
    doId = todayDo.id; doNow = `${hm(todayDo.start)}から「${doName(todayDo)}」`;
    doNote = `とりあえずここまで：${esc(stageOf(todayDo) || '手をつける')}`;
  } else if (deadlines[0]) {
    doNow = `「${deadlines[0].title}」を少し進める`;
    doNote = 'とりあえず15分だけ';
  } else {
    doNow = '決まった予定はなし'; doNote = '自分のための時間';
  }
  html += `<div class="card"${doId !== '' ? ` data-id="${esc(doId)}"` : ''}><div class="label">いまやること</div><div class="big">${esc(doNow)}</div><div class="note">${doNote}</div></div>`;

  // 次の約束
  if (next) {
    const wrap = new Date(next.start.getTime() - WRAP_UP_MIN * 6e4);
    const left = (next.start - now) / 6e4;
    const dayLabel = sameDay(next.start, now) ? '' : `${next.start.getMonth() + 1}/${next.start.getDate()} `;
    html += `<div class="card" data-id="${esc(next.id)}"><div class="label">次の約束</div>
      <div class="mid">${badge(next.cat)}<span class="t-${next.cat}">${dayLabel}${hm(next.start)} ${esc(next.title)}</span></div>
      <div class="count">あと${dur(left)}</div>
      <div class="note">${hm(wrap)}までに切り上げ</div></div>`;
  }

  const wn = weatherNotes(evs, now);
  if (wn.length) html += `<div class="card"><div class="label">天気</div>${wn.map(t => `<div class="wxline">${esc(t)}</div>`).join('')}</div>`;

  const rest = today.filter(e => e.start > now).length;
  html += `<div class="link" onclick="go(1)">今日の残り ${rest}件 ▸</div>`;
  document.getElementById('A').innerHTML = html;
}

// ---------- B 今日の時間の川 ----------
function renderB(evs, now) {
  const d0 = startOfDay(now);
  const today = evs.filter(e => sameDay(e.start, now) || (e.start < d0 && e.end > d0));
  const allDay = today.filter(e => e.allDay);
  const timed = today.filter(e => !e.allDay).sort((a, b) => a.start - b.start);
  let html = '';
  const wd = wxDay(now);
  if (wd) html += `<div class="wx">${wd.icon} ${wd.name}　${wd.max}°/${wd.min}°　雨${wd.pop}%</div>`;
  if (allDay.length) html += `<div class="allday">終日：${allDay.map(e => badge(e.cat) + esc(e.title)).join('　')}</div>`;

  const dayStart = new Date(d0); dayStart.setHours(DAY_START);
  const dayEnd = new Date(d0); dayEnd.setHours(DAY_END);
  let cursor = dayStart, nowShown = false;
  const items = [];
  const pushGap = (a, b) => {
    const from = a < now && now < b ? now : a;
    if (b <= now) return;
    const min = (b - from) / 6e4;
    if (min >= MIN_GAP) items.push({ type: 'gap', from, to: b, min });
  };
  for (const e of timed) {
    if (e.start > cursor) pushGap(cursor, e.start);
    items.push({ type: 'ev', e });
    if (e.end > cursor) cursor = e.end;
  }
  if (cursor < dayEnd) pushGap(cursor, dayEnd);

  html += '<div class="river">';
  for (const it of items) {
    const t = it.type === 'ev' ? it.e.start : it.from;
    if (!nowShown && t >= now) { html += '<div class="nowline"></div>'; nowShown = true; }
    if (it.type === 'ev') {
      const e = it.e, past = e.end <= now ? ' past' : '';
      html += `<div class="ev ${e.cat}${past}" data-id="${esc(e.id)}"><span class="time">${hm(e.start)}</span><div class="box">
        <div class="ttl">${esc(e.title)}</div><div class="sub">${hm(e.start)}–${hm(e.end)}${e.location ? '　' + esc(e.location) : ''}${rainMark(e)}</div></div></div>`;
    } else {
      html += `<div class="gap"><span class="time">${hm(it.from)}</span><div class="box">すき間 <b>${dur(it.min)}</b>（${hm(it.from)}–${hm(it.to)}）</div></div>`;
    }
  }
  if (!nowShown) html += '<div class="nowline"></div>';
  html += '</div>';
  if (!timed.length && !allDay.length) html = '<div class="empty">今日は決まった予定がありません</div>';
  document.getElementById('B').innerHTML = html;
  document.getElementById('dateB').textContent = `${now.getMonth() + 1}/${now.getDate()}(${'日月火水木金土'[now.getDay()]})`;
}

// ---------- C 締切の地平線 ----------
function renderC(evs, now) {
  const d0 = startOfDay(now);
  const list = evs.filter(e => e.deadline && e.end > now).sort((a, b) => a.start - b.start);
  if (!list.length) { document.getElementById('C').innerHTML = '<div class="empty">見えている締切はありません</div>'; return; }
  let html = '';
  for (const e of list) {
    const days = Math.round((startOfDay(e.start) - d0) / 864e5);
    const near = Math.max(0.06, Math.min(1, 1 - days / 30));
    const color = days <= 3 ? 'var(--hot)' : days <= 7 ? 'var(--warn)' : 'var(--calm)';
    const left = days <= 0 ? '今日' : days === 1 ? '明日' : `あと${days}日`;
    const size = days <= 3 ? 20 : days <= 7 ? 17 : 15;
    html += `<div class="dl" data-id="${esc(e.id)}"><div class="row"><span class="name" style="font-size:${size}px">${badge(e.cat)}${esc(e.title)}</span>
      <span class="left" style="color:${color}">${left}</span></div>
      <div class="bar"><i style="width:${near * 100}%;background:${color}"></i></div>
      <div class="note">${e.start.getMonth() + 1}/${e.start.getDate()}(${'日月火水木金土'[e.start.getDay()]})${e.allDay ? '' : ' ' + hm(e.start)}　${nextDo(e, now)}</div></div>`;
  }
  document.getElementById('C').innerHTML = html;
}

// ---------- 一言を読む（ルール） ----------
const CAT_WORDS = {
  family: /家族|みゆ|妻|嫁|子ども|子供|息子|娘|迎え|送り|保育園|幼稚園|こども園|降園|ピアノ|実家|誕生日|病院|歯医者|小児科|散髪|買い物|弁当|旅行|帰省/,
  union: /組合|分会|支部|教組|執行委員|組織委員|マルタイ|定期大会|青年部|女性部/,
  work: /学校|職員|会議|授業|研修|初任研|報告書|校長|教頭|学年|児童|保護者|指導|研究|行事|委員会|校務|教務|通知表|所見|学級|出張|PTA|運動会|参観|面談|起案|文書|主任|巡回|給食/
};
const DL_WORDS = /までに|締切|締め切り|〆切|しめきり|期限|提出/;
const WD = '日月火水木金土';
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = startOfDay(d); x.setDate(x.getDate() + n); return x; };

function parseLine(text, now) {
  let s = text.normalize('NFKC').replace(/[〜～]/g, '~').trim();
  const out = { raw: text.trim(), cat: null, date: null, start: null, end: null, deadline: false, mins: 30, title: '', ampm: false };
  const cut = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };

  // 分類：先頭の【家族】や「仕事:」
  let m = cut(/^【?(家族|仕事|組合)】?\s*[:：]?\s*/);
  if (m) out.cat = { 家族: 'family', 仕事: 'work', 組合: 'union' }[m[1]];

  // 日付
  const today = startOfDay(now);
  if ((m = cut(/(?:(\d{4})[\/年])?(\d{1,2})[\/月](\d{1,2})日?/))) {
    const y = m[1] ? +m[1] : now.getFullYear();
    let d = new Date(y, +m[2] - 1, +m[3]);
    if (!m[1] && d < addDays(today, -60)) d = new Date(y + 1, +m[2] - 1, +m[3]);
    out.date = d;
  } else if ((m = cut(/明後日|あさって/))) out.date = addDays(today, 2);
  else if ((m = cut(/明日|あした|あす/))) out.date = addDays(today, 1);
  else if ((m = cut(/今日|きょう|本日/))) out.date = today;
  else if ((m = cut(/(再来週|来週|今週)?の?([日月火水木金土])曜日?/))) {
    const want = WD.indexOf(m[2]), mon = addDays(today, -((today.getDay() + 6) % 7));
    if (m[1]) {
      const wk = { 今週: 0, 来週: 7, 再来週: 14 }[m[1]];
      out.date = addDays(mon, wk + (want + 6) % 7);
    } else out.date = addDays(today, (want - today.getDay() + 7) % 7);
  } else if ((m = cut(/(\d{1,2})日(?!間)/))) {
    let d = new Date(now.getFullYear(), now.getMonth(), +m[1]);
    if (d < today) d = new Date(now.getFullYear(), now.getMonth() + 1, +m[1]);
    out.date = d;
  }
  cut(/[(（][日月火水木金土](?:曜日?)?[)）]/);

  // 作業時間「30分くらい」「1時間」（時刻より先に取る）
  if ((m = cut(/(\d+)\s*(?:(分)|時間)(?:くらい|ほど|ぐらい)/) || cut(/(\d+)\s*時間/))) out.mins = +m[1] * (m[2] ? 1 : 60);

  // 時刻（「〜17時」があれば終わり）
  const T = /(午前|午後|朝|夕方|夜)?\s*(\d{1,2})(?::(\d{2})|時(?:(半)|(\d{1,2})分)?)/;
  const toMin = t => {
    let h = +t[2]; const mm = t[3] ? +t[3] : t[4] ? 30 : t[5] ? +t[5] : 0;
    if (/午後|夕方|夜/.test(t[1] || '') && h < 12) h += 12;
    else if (!t[1] && h >= 1 && h <= 4) h += 12; // 「3時」は15時とみる
    else if (!t[1] && h >= 5 && h <= 7) out.ampm = true; // 「6時」は朝か夕方か聞く
    return h * 60 + mm;
  };
  const t1 = cut(T);
  if (t1) {
    out.start = toMin(t1);
    const t2 = s.match(new RegExp('^\\s*(?:~|-|から|ー)\\s*' + T.source));
    if (t2) { s = s.replace(t2[0], ' '); out.end = toMin(t2); }
  }
  if (out.start == null && (m = cut(/(?:~|から)\s*(\d{1,2})時/))) out.end = +m[1] * 60;

  // 締切か
  if (DL_WORDS.test(s) || (out.date && out.start == null && /まで/.test(s))) out.deadline = true;
  cut(/までに|まで/);

  out.title = s.replace(/\s+/g, ' ').trim().replace(/(^|\s)[のにでへ](?=\s|$)/g, ' ').trim().replace(/^(?:[\s、,.。:：にの]|から|より)+|[\s、,.。]+$/g, '');
  if (!out.cat) {
    const hits = Object.keys(CAT_WORDS).filter(c => CAT_WORDS[c].test(out.title));
    // 組合の言葉は他と紛れにくいので先に決める。家族と仕事が両方出たら聞く
    if (hits.includes('union')) out.cat = 'union';
    else if (hits.length === 1) out.cat = hits[0];
  }
  if (out.deadline && !DEADLINE_RE.test(out.title)) out.title += ' 締切';
  return out;
}

// 足りないものを数える（これが空なら、そのまま登録してよい）
function missing(p) {
  const need = [];
  if (!p.title) need.push('title');
  if (!p.date) need.push('date');
  if (!p.cat) need.push('cat');
  if (!p.deadline && !p.allDay && (p.start == null || p.ampm)) need.push('time');
  return need;
}

// 締切のための作業（▶ の予定、または説明に「締切M/D」と書いた作業）
function plansOf(dl) {
  const md0 = `${dl.start.getMonth() + 1}/${dl.start.getDate()}`, want = '▶ ' + baseTitle(dl.title), lim = addDays(dl.start, 1);
  return EVENTS.filter(v => v !== dl && !v.allDay && v.start < lim &&
    (v.title.startsWith(want) || v.desc.includes('締切' + md0) || v.desc.includes(md0 + '締切'))).sort((a, b) => a.start - b.start);
}
// 「とりあえずここまで」（作業の説明から）
const stageOf = e => { const m = (e.desc || '').match(/ここまで[」』]?[:：]\s*([^\n。]+?)(?:（\d+\/\d+）)?(?:\n|。|$)/); return m ? m[1] : ''; };
const isDo = e => e.title.startsWith('▶') || !!stageOf(e) || /締切\d+\/\d+の逆算|\d+\/\d+締切/.test(e.desc);
const doName = e => e.title.replace(/^▶\s*/, '');
// 締切の次の「やる日」と、今日なら「今日はここまで」
function nextDo(e, now) {
  const all = plansOf(e), x = all.find(v => v.end > now);
  if (!x) return all.length ? 'やる日は終わり。あとは出すだけ' : 'やる日はまだ';
  const st = stageOf(x), n = all.indexOf(x) + 1;
  if (sameDay(x.start, now)) return `<b>今日 ${hm(x.start)}〜</b>${st ? '　ここまで：' + esc(st) : ''}`;
  return `次のやる日：${md(x.start)} ${hm(x.start)}${all.length > 1 ? `（${n}/${all.length}）` : ''}${st ? '　' + esc(st) : ''}`;
}

// ---------- 天気（大分市。予定に結びつけて一言） ----------
// 朝の声かけ（ステップ4）でも weatherNotes() をそのまま使う
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=33.2396&longitude=131.6093'
  + '&hourly=precipitation_probability,precipitation,weather_code,temperature_2m'
  + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3';
const OUT_RE = /迎え|送り|運動会|遠足|えんそく|サッカー|スイミング|試合|校外|見学|プール|公園|散歩|外出|出張|会館|センター|いもほり|ハロウィン|子ども会|買い物|病院|帰省|旅行|訪問/;
const RAIN_POP = 50;            // 降水確率がこれ以上なら知らせる（%）
let WX = null;
async function loadWx() {
  try { const c = JSON.parse(store.get('levi_wx') || 'null'); if (c) { WX = c.data; if (Date.now() - c.at < 30 * 6e4) return; } } catch (e) {}
  try {
    const data = await (await fetch(WX_URL)).json();
    if (data.hourly && data.daily) { WX = data; store.set('levi_wx', JSON.stringify({ at: Date.now(), data })); }
  } catch (e) {} // 天気が取れなくても予定は出す
}
function wxName(code) {
  if (code >= 95) return ['⛈', '雷雨']; if (code >= 85) return ['❄', '雪']; if (code >= 80) return ['☔', 'にわか雨'];
  if (code >= 71) return ['❄', '雪']; if (code >= 61) return ['☔', '雨']; if (code >= 51) return ['🌦', '小雨'];
  if (code >= 45) return ['🌫', '霧']; if (code === 3) return ['☁', 'くもり']; if (code >= 1) return ['🌤', '晴れ時々くもり']; return ['☀', '晴れ'];
}
function wxDay(d) {
  if (!WX) return null;
  const i = WX.daily.time.indexOf(ymd(d)); if (i < 0) return null;
  const [icon, name] = wxName(WX.daily.weather_code[i]);
  return { icon, name, max: Math.round(WX.daily.temperature_2m_max[i]), min: Math.round(WX.daily.temperature_2m_min[i]), pop: WX.daily.precipitation_probability_max[i] ?? 0 };
}
// from〜to（時）の間でいちばん降りそうな値
function wxRain(from, to) {
  if (!WX) return null;
  let pop = -1, mm = 0;
  for (let t = new Date(from); t < to; t = new Date(t.getTime() + 36e5)) {
    const i = WX.hourly.time.indexOf(`${ymd(t)}T${pad(t.getHours())}:00`); if (i < 0) continue;
    pop = Math.max(pop, WX.hourly.precipitation_probability[i] ?? 0); mm = Math.max(mm, WX.hourly.precipitation[i] ?? 0);
  }
  return pop < 0 ? null : { pop, mm, wet: pop >= RAIN_POP || mm >= 1 };
}
const outside = e => e.cat === 'family' || OUT_RE.test(e.title) || !!e.location;
function rainOf(e) {
  if (e.allDay) { const a = new Date(e.start); a.setHours(8); const b = new Date(e.start); b.setHours(16); return wxRain(a, b); }
  const a = new Date(e.start); a.setMinutes(0, 0, 0);
  return wxRain(a, new Date(Math.min(e.end, e.start.getTime() + 3 * 36e5)));
}
function rainMark(e) {
  if (!outside(e)) return '';
  const r = rainOf(e); return r && r.wet ? `　<span class="rain">☔${r.pop}%</span>` : '';
}
// 予定にかかわる天気だけを一言ずつ（最大3つ）。夕方からは明日の分も見る
function weatherNotes(evs, now) {
  if (!WX) return [];
  const days = [startOfDay(now)]; if (now.getHours() >= 15) days.push(addDays(now, 1));
  const out = [];
  for (const d of days) {
    const lab = sameDay(d, now) ? '' : '明日 ';
    const list = evs.filter(e => sameDay(e.start, d) && outside(e) && (e.allDay || e.end > now)).sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
    for (const e of list) {
      const r = rainOf(e); if (!r || !r.wet) continue;
      if (e.allDay) out.push(`${lab}「${e.title}」 雨${r.pop}%${/運動会|遠足|えんそく|いもほり|試合/.test(e.title) ? '。中止・延期の連絡に気をつけて' : ''}`);
      else out.push(`${lab}${hm(e.start)}「${e.title}」のころ 雨${r.pop}%。${/迎え|送り|サッカー|スイミング/.test(e.title) || e.cat === 'family' ? '傘を車に' : '傘を持って'}`);
    }
    // 朝の冷え込みと寒暖差（今日は朝のうちだけ、明日は夕方から）
    const w = wxDay(d);
    if (w && (lab || now.getHours() < 10)) {
      if (w.min <= 10) out.push(`${lab || '今朝は'}${lab ? '朝は' : ''}${w.min}°。上着を`);
      else if (w.max - w.min >= 10) out.push(`${lab}寒暖差${w.max - w.min}°（${w.min}°→${w.max}°）。脱ぎ着しやすく`);
    }
  }
  return out.slice(0, 3);
}

// ---------- データ ----------
let EVENTS = [];
function render() {
  const now = new Date();
  document.getElementById('clock').textContent = hm(now);
  renderA(EVENTS, now); renderB(EVENTS, now); renderC(EVENTS, now);
  if (calOpen) renderCal();
}
async function load() {
  loadWx().then(render);
  const url = store.get('levi_url'), key = store.get('levi_key');
  const banner = document.getElementById('banner');
  if (!url || !key) {
    EVENTS = demoEvents().map((r, j) => shape({ id: 'demo-s' + j, ...r }));
    banner.textContent = 'サンプル表示中（⚙︎から設定すると自分の予定になります）'; banner.style.display = 'block';
    return render();
  }
  const cached = store.get('levi_cache');
  if (cached) { try { EVENTS = JSON.parse(cached).events.map(shape); render(); } catch (e) {} }
  try {
    let data;
    try {
      const res = await fetch(`${url}?k=${encodeURIComponent(key)}&t=${Date.now()}`);
      data = await res.json();
    } catch (e) {
      throw new Error('URLかアクセスできるユーザー（全員）を確かめてください');
    }
    if (data.error === 'unauthorized') throw new Error('合言葉が違います');
    if (data.error) throw new Error(data.error);
    store.set('levi_cache', JSON.stringify(data));
    EVENTS = data.events.map(shape); banner.style.display = 'none';
  } catch (e) {
    banner.textContent = (cached ? '最新の予定を取れませんでした（前回の内容を表示中）：' : '予定を取れませんでした：') + e.message;
    banner.style.display = 'block';
  }
  render();
}

// サンプル（設定前のプレビュー用）
function demoEvents() {
  const d = startOfDay(new Date());
  const at = (day, h, m) => { const x = new Date(d); x.setDate(x.getDate() + day); x.setHours(h, m || 0); return x.toISOString(); };
  const allDay = day => ({ start: at(day, 0), end: at(day + 1, 0), allDay: true });
  const mdOf = day => { const x = addDays(d, day); return `${x.getMonth() + 1}/${x.getDate()}`; };
  return [
    { title: '【仕事】職員朝会', start: at(0, 8, 10), end: at(0, 8, 25) },

// ---------- 予定を入れる（＋） ----------
const sheet = document.getElementById('add');
const inText = document.getElementById('inText');
let DRAFTS = [];
const md = d => `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
const atMin = (d, min) => { const x = startOfDay(d); x.setMinutes(min); return x; };
const minStr = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const baseTitle = t => t.replace(/^(締切|〆切|期限)[:：]\s*|^〆\s*/, '').replace(/\s*(締切|締め切り|〆切|しめきり|期限)$/, '').trim();

const showInput = on => {
  ['inText', 'read', 'addHint', 'addPreset'].forEach(x => { document.getElementById(x).style.display = on ? '' : 'none'; });
  document.getElementById('addTitle').textContent = on ? '予定を入れる' : '予定を直す';
};
// 予定を入れる画面を開く。暦の日付から開いたときは、その日を決めておく
let presetDate = null;
function openAdd(dateKey) {
  presetDate = dateKey ? new Date(dateKey + 'T00:00') : null;
  const pre = document.getElementById('addPreset');
  pre.innerHTML = presetDate ? `<b>${md(presetDate)}</b> に入れます（日付を書けば、そちらが優先）` : '';
  pre.style.display = presetDate ? 'block' : 'none';
  DRAFTS = DRAFTS.filter(d => d.mode !== 'edit'); renderDrafts();
  showInput(true); sheet.style.display = 'block'; inText.focus();
}
document.getElementById('plus').onclick = () => openAdd(null);
document.getElementById('addClose').onclick = () => { sheet.style.display = 'none'; };
document.getElementById('read').onclick = () => {
  const now = new Date();
  const lines = inText.value.split(/\n+/).map(x => x.trim()).filter(Boolean);
  if (!lines.length) return;
  const fresh = lines.map(l => {
    const p = parseLine(l, now);
    if (!p.date && presetDate) p.date = presetDate;
    return { p, status: 'edit', ids: [], msg: '' };
  });
  DRAFTS = fresh.concat(DRAFTS.filter(d => d.status === 'done'));
  inText.value = '';
  renderDrafts();
  fresh.filter(d => !missing(d.p).length).forEach(save); // はっきりしたものはそのまま入れる
};

function renderDrafts() {
  document.getElementById('drafts').innerHTML = DRAFTS.map((d, i) => {
    const p = d.p, need = missing(p);
    const ask = k => need.includes(k) ? ' ask' : '';
    if (d.status === 'done') {
      const when = p.deadline ? `${md(p.date)} 締切` : p.allDay ? `${md(p.date)} 終日` : `${md(p.date)} ${minStr(p.start)}`;
      const dl = p.deadline && EVENTS.find(e => e.id === d.ids[0]), pl = dl ? plansOf(dl) : [];
      const dd = !p.deadline ? '' : pl.length ? `<div class="label" style="margin-top:12px">逆算してやる日を置きました</div>
        <div class="note">${pl.map(x => `${md(x.start)} ${hm(x.start)}–${hm(x.end)}${stageOf(x) ? '　' + esc(stageOf(x)) : ''}`).join('<br>')}</div>` :
        `<div class="note" style="margin-top:8px">${d.planning ? 'やる日を逆算しています…' : '3週間以内になったら、リヴァイがやる日を置きます'}</div>`;
      return `<div class="card draft"><div class="label">入れました ✓${d.msg ? '　' + esc(d.msg) : ''}</div>
        <div class="mid">${badge(p.cat)}${esc(p.title)}</div><div class="note">${when}</div>${dd}
        <div class="link"><span onclick="undo(${i})">取り消す</span></div></div>`;
    }
    return `<div class="card draft">
      <div class="label">${d.mode === 'edit' ? '予定を直す' : need.length ? 'ここだけ教えてください' : '読み取った内容'}</div>
      <input class="f${ask('title')}" value="${esc(p.title)}" placeholder="なにを" onchange="setP(${i},'title',this.value)">
      <div class="chips${ask('cat')}">${['family', 'work', 'union'].map(c => `<button class="chip cc-${c}${p.cat === c ? ' on' : ''}" onclick="setP(${i},'cat','${c}')">${CAT_NAME[c]}</button>`).join('')}</div>
      <div class="chips${ask('date')}">${[0, 1, 2].map(n => { const x = addDays(new Date(), n);
        return `<button class="chip${p.date && sameDay(p.date, x) ? ' on' : ''}" onclick="setP(${i},'date',${n})">${['今日', '明日', '明後日'][n]}</button>`; }).join('')}
        <input type="date" class="f sm" value="${p.date ? ymd(p.date) : ''}" onchange="setP(${i},'dateStr',this.value)"></div>
      <div class="chips${ask('time')}">
        <button class="chip${p.deadline ? ' on' : ''}" onclick="setP(${i},'deadline',${!p.deadline})">締切</button>
        ${p.deadline ? '' : `<button class="chip${p.allDay ? ' on' : ''}" onclick="setP(${i},'allDay',${!p.allDay})">終日</button>
        ${p.allDay ? '' : p.ampm ? [p.start, p.start + 720].map(m => `<button class="chip" onclick="setP(${i},'pick',${m})">${m < 720 ? '朝' : '夕方'} ${minStr(m)}</button>`).join('') + ' ' : ''}${p.allDay ? '' : `<input type="time" class="f sm" value="${p.start != null ? minStr(p.start) : ''}" onchange="setP(${i},'start',this.value)">
        〜 <input type="time" class="f sm" value="${p.end != null ? minStr(p.end) : ''}" onchange="setP(${i},'end',this.value)">`}`}</div>
      ${d.status === 'error' ? `<div class="note" style="color:var(--hot)">${esc(d.msg)}</div>` : ''}
      ${d.mode === 'edit' ? `<button class="btn" onclick="saveEdit(${i})" ${need.length || d.status === 'saving' ? 'disabled' : ''}>${d.status === 'saving' ? '直しています…' : '保存'}</button>
      <button class="btn ghost" onclick="removeEv(${i})">削除</button>
      <button class="btn ghost" onclick="DRAFTS.splice(${i},1);renderDrafts();sheet.style.display='none'">閉じる</button>` :
      `<button class="btn" onclick="save(DRAFTS[${i}])" ${need.length || d.status === 'saving' ? 'disabled' : ''}>${d.status === 'saving' ? '入れています…' : '登録'}</button>
      <button class="btn ghost" onclick="DRAFTS.splice(${i},1);renderDrafts()">やめる</button>`}</div>`;
  }).join('');
}

function setP(i, k, v) {
  const d = DRAFTS[i], p = d.p;
  const toMin = s => { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  if (k === 'date') p.date = addDays(new Date(), v);
  else if (k === 'dateStr') p.date = v ? new Date(v + 'T00:00') : null;
  else if (k === 'start' || k === 'end') { p[k] = toMin(v); p.ampm = false; }
  else if (k === 'pick') { p.start = v; p.ampm = false; }
  else if (k === 'deadline') { p.deadline = v; if (v && !DEADLINE_RE.test(p.title)) p.title += ' 締切'; if (!v) p.title = baseTitle(p.title); }
  else p[k] = v;
  renderDrafts();
}

// カレンダーに入れる形にする
function toItem(p) {
  if (p.deadline || p.allDay) return { title: p.title, cat: p.cat, allDay: true, date: ymd(p.date) };
  const s = atMin(p.date, p.start), e = p.end != null && p.end > p.start ? atMin(p.date, p.end) : new Date(s.getTime() + 60 * 6e4);
  return { title: p.title, cat: p.cat, allDay: false, start: s.toISOString(), end: e.toISOString() };
}
async function post(body) {
  const url = store.get('levi_url'), key = store.get('levi_key');
  if (!url || !key) return { ok: true, demo: true, ids: (body.items || []).map(() => 'demo' + Math.random()) };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: key, ...body }) });
  const data = await res.json();
  if (data.error === 'unauthorized') throw new Error('合言葉が違います');
  if (data.error) throw new Error(data.error);
  return data;
}
// 画面にもすぐ出す（カレンダーからの取り直しを待たない）
function addLocal(items, ids) {
  items.forEach((it, j) => EVENTS.push(shape({ id: ids[j], title: (CAT_PREFIX_OF[it.cat] || '') + it.title, allDay: it.allDay,
    start: it.allDay ? new Date(it.date + 'T00:00').toISOString() : it.start,
    end: it.allDay ? addDays(new Date(it.date + 'T00:00'), 1).toISOString() : it.end })));
  render();
}
async function save(d) {
  d.status = 'saving'; renderDrafts();
  try {
    const items = [toItem(d.p)];
    const r = await post({ action: 'add', items });
    d.ids = r.ids; d.status = 'done'; d.msg = r.demo ? 'サンプル表示中なのでカレンダーには入りません' : '';
    addLocal(items, r.ids);
    // 締切なら、取り直したときにApps Scriptがやる日を置く
    if (d.p.deadline && !r.demo) { d.planning = true; renderDrafts(); await load(); d.planning = false; }
  } catch (e) {
    d.status = 'error'; d.msg = errMsg(e);
  }
  renderDrafts();
}
async function undo(i) {
  const d = DRAFTS[i], dl = EVENTS.find(e => e.id === d.ids[0]);
  // 締切を取り消すなら、リヴァイが置いたやる日も一緒に（手で置いた作業は消さない）
  const ids = d.ids.concat(dl && d.p.deadline ? plansOf(dl).filter(x => x.desc.includes('（リヴァイが登録）')).map(x => x.id) : []);
  try {
    await post({ action: 'delete', ids });
    EVENTS = EVENTS.filter(e => !ids.includes(e.id));
    DRAFTS.splice(i, 1); renderDrafts(); render();
  } catch (e) { d.msg = '取り消せませんでした：' + e.message; renderDrafts(); }
}

// ---------- 月の暦（サブ画面。🗓から開く） ----------
const calEl = document.getElementById('cal');
let calOpen = false, calSel = null;
const calShow = { family: true, work: true, union: true, other: true };
const REST_RE = /休業|休み|年休|振替/;
document.querySelectorAll('.calbtn').forEach(b => b.onclick = () => {
  calOpen = true; calSel = ymd(new Date()); renderCal(); calEl.style.display = 'block'; calEl.scrollTop = 0;
});
document.getElementById('calClose').onclick = () => { calOpen = false; calEl.style.display = 'none'; };

function renderCal() {
  const now = new Date(), today = ymd(now), t0 = startOfDay(now);
  const vis = EVENTS.filter(e => calShow[e.cat]);
  // 日ごとの索引（終日は終わりの日を含まない）
  const byDay = {};
  for (const e of vis) {
    let d = startOfDay(e.start); const end = e.allDay ? e.end : addDays(e.start, 1);
    for (let g = 0; d < end && g < 120; g++, d = addDays(d, 1)) (byDay[ymd(d)] ||= []).push(e);
  }
  const sorted = arr => arr.slice().sort((a, b) => (b.allDay - a.allDay) || ((a.cat === 'family' ? 0 : 1) - (b.cat === 'family' ? 0 : 1)) || (a.start - b.start));

  // しぼり込み
  const used = ['family', 'work', 'union'].concat(EVENTS.some(e => e.cat === 'other') ? ['other'] : []);
  document.getElementById('calF').innerHTML = used.map(c =>
    `<button class="kchip ${c}" aria-pressed="${calShow[c]}" onclick="calShow.${c}=!calShow.${c};renderCal()"><span class="sw"></span>${CAT_NAME[c]}</button>`).join('');

  // 締切の地平線（横スクロール）
  const dls = vis.filter(e => e.deadline && e.end > now).sort((a, b) => a.start - b.start);
  document.getElementById('calH').innerHTML = dls.length ? dls.map(e => {
    const left = Math.round((startOfDay(e.start) - t0) / 864e5);
    return `<div class="kd ${e.cat}${left <= 7 ? ' near' : ''}" data-id="${esc(e.id)}"><div class="n" style="font-size:${Math.max(20, 40 - left * 0.45)}px">${left}<small>日</small></div>
      <div class="w">${md(e.start)}</div><div class="t">${esc(e.title.replace(/^締切[:：]|^〆\s*/, ''))}</div></div>`;
  }).join('') : '<p class="note">表示中の締切はありません</p>';

  // 今月から6か月
  let tabs = '', months = '';
  for (let k = 0; k < 6; k++) {
    const first = new Date(now.getFullYear(), now.getMonth() + k, 1), last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    const id = 'cm' + k;
    let count = 0, nd = 0;
    for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
      const key = ymd(d); if (key < today) continue;
      (byDay[key] || []).forEach(e => { if (ymd(e.start) === key) { count++; if (e.deadline) nd++; } });
    }
    tabs += `<button class="mtab" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${first.getMonth() + 1}月<span class="c">${count}</span></button>`;
    let g = WD.split('').map((w, j) => `<div class="dow${j === 0 ? ' sun' : j === 6 ? ' sat' : ''}">${w}</div>`).join('');
    g += '<div class="day out"></div>'.repeat(first.getDay());
    for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
      const key = ymd(d), evs = sorted(byDay[key] || []);
      const cls = (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + (key === today ? ' today' : '') + (key < today ? ' past' : '')
        + (evs.some(e => REST_RE.test(e.title)) ? ' rest' : '') + (key === calSel ? ' sel' : '');
      g += `<button class="day${cls}" onclick="calSel='${key}';renderCal()"><span class="num"><b>${d.getDate()}</b>${evs.some(e => e.deadline) ? '<span class="flag">〆</span>' : ''}</span>
        <span class="dots">${evs.slice(0, 6).map(e => `<span class="dot ${e.cat}"></span>`).join('')}</span>
        <span class="chipsx">${evs.slice(0, 3).map(e => `<span class="evx ${e.cat}">${e.allDay ? '' : hm(e.start) + ' '}${esc(e.title)}</span>`).join('')}${evs.length > 3 ? `<span class="more">ほか${evs.length - 3}件</span>` : ''}</span></button>`;
    }
    let det = '';
    if (calSel && calSel.slice(0, 7) === ymd(first).slice(0, 7)) {
      const sd = new Date(calSel + 'T00:00'), evs = sorted(byDay[calSel] || []);
      det = `<div class="det"><h4>${md(sd)}${calSel === today ? '　今日' : ''}</h4>` + (evs.length ? '<ul>' + evs.map(e => {
        let when = e.allDay ? '終日' : `${hm(e.start)}–${hm(e.end)}`;
        if (e.allDay && e.end - e.start > 864e5) when = '〜' + md(addDays(e.end, -1));
        return `<li data-id="${esc(e.id)}"><span class="tm">${when}</span><span class="tt ${e.cat}">${e.deadline ? '〆 ' : ''}${esc(e.title)}（${CAT_NAME[e.cat]}）</span></li>`;
      }).join('') + '</ul>' : '<p class="note">予定はありません</p>')
        + `<button class="addday" onclick="openAdd('${calSel}')">＋ この日に予定を入れる</button></div>`;
    }
    // スマホ：日ごとの一覧。日付を押すとその日に予定を入れる
    let ag = '';
    for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
      const key = ymd(d); if (key < today) continue;
      const evs = sorted(byDay[key] || []);
      const cls = (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + (key === today ? ' today' : '')
        + (evs.some(e => REST_RE.test(e.title)) ? ' rest' : '') + (evs.length ? '' : ' empty');
      ag += `<div class="aday${cls}"><button class="adate" onclick="openAdd('${key}')" aria-label="${md(d)}に予定を入れる"><b>${d.getDate()}</b><span>${WD[d.getDay()]}${key === today ? '・今日' : ''}</span>${evs.some(e => e.deadline) ? '<span class="flag">〆</span>' : ''}${evs.length ? '<span class="plus">＋</span>' : ''}</button>
        <div class="aevs">${evs.length ? evs.map(e => {
          let when = e.allDay ? '終日' : `${hm(e.start)}–${hm(e.end)}`;
          if (e.allDay && e.end - e.start > 864e5) when = '〜' + md(addDays(e.end, -1)).replace(/\(.\)/, '');
          return `<div class="aev" data-id="${esc(e.id)}"><span class="tm">${when}</span><span class="tt ${e.cat}${e.deadline ? ' dlx' : ''}">${e.deadline ? '〆 ' : ''}${esc(e.title)}</span></div>`;
        }).join('') : '<span onclick="openAdd(\'' + key + '\')">＋</span>'}</div></div>`;
    }
    months += `<section class="month" id="${id}"><div class="mhead"><h3>${first.getMonth() + 1}月</h3><span>${first.getFullYear()}年　予定 ${count}件${nd ? '・締切 ' + nd + '件' : ''}</span></div>
      <div class="grid">${g}</div>${det}<div class="agenda">${ag || '<p class="note" style="padding:12px">この月の予定はありません</p>'}</div></section>`;
  }
  document.getElementById('calT').innerHTML = tabs;
  document.getElementById('calM').innerHTML = months;
}

// ---------- 長押しで直す ----------
let pressT = null, pressEl = null, pressXY = null;
function pressEnd() { clearTimeout(pressT); pressT = null; if (pressEl) pressEl.classList.remove('pressing'); pressEl = null; }
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('#pages [data-id], #cal [data-id]');
  if (!el) return;
  pressEl = el; pressXY = [ev.clientX, ev.clientY]; el.classList.add('pressing');
  pressT = setTimeout(() => {
    const id = el.dataset.id; pressEnd();
    // 古いApps Scriptは予定のIDを返さないので直せない。黙って何もしないと分からないので伝える
    if (!id) toast('この予定を直すには、Apps Scriptを新しいバージョンでデプロイし直してください');
    else openEdit(id);
  }, 500);
});
document.addEventListener('pointermove', ev => {
  if (pressEl && Math.hypot(ev.clientX - pressXY[0], ev.clientY - pressXY[1]) > 10) pressEnd();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, pressEnd));
pages.addEventListener('scroll', pressEnd, { passive: true });
document.getElementById('cal').addEventListener('scroll', pressEnd, { passive: true });
document.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-id]')) ev.preventDefault(); });

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function openEdit(id) {
  const e = EVENTS.find(x => x.id === id);
  if (!e) return;
  const mins = d => d.getHours() * 60 + d.getMinutes();
  const p = { title: e.title, cat: e.cat === 'other' ? null : e.cat, date: startOfDay(e.start), allDay: e.allDay,
    deadline: e.deadline && e.allDay, start: e.allDay ? null : mins(e.start), end: e.allDay ? null : mins(e.end), mins: 30 };
  DRAFTS = [{ p, mode: 'edit', id, status: 'edit', ids: [], msg: '' }];
  renderDrafts();
  showInput(false); sheet.style.display = 'block';
}
async function saveEdit(i) {
  const d = DRAFTS[i];
  d.status = 'saving'; renderDrafts();
  try {
    const it = { id: d.id, ...toItem(d.p) };
    if (!d.id.startsWith('demo') && store.get('levi_url')) await post({ action: 'update', item: it });
    EVENTS = EVENTS.filter(e => e.id !== d.id);
    addLocal([it], [d.id]);
    DRAFTS.splice(i, 1); renderDrafts(); sheet.style.display = 'none';
  } catch (e) { d.status = 'error'; d.msg = errMsg(e); renderDrafts(); }
}
async function removeEv(i) {
  const d = DRAFTS[i];
  if (!confirm(`「${d.p.title}」を消します。よろしいですか？`)) return;
  try {
    if (store.get('levi_url')) await post({ action: 'delete', ids: [d.id], any: true });
    EVENTS = EVENTS.filter(e => e.id !== d.id);
    DRAFTS.splice(i, 1); renderDrafts(); render(); sheet.style.display = 'none';
  } catch (e) { d.status = 'error'; d.msg = errMsg(e); renderDrafts(); }
}
const errMsg = e => /JSON|fetch|Load failed/i.test(e.message) ? 'Apps Scriptを新しいバージョンでデプロイし直してください' : e.message;

load();
setInterval(render, 30 * 1000);       // 残り時間は30秒ごとに更新
setInterval(load, 5 * 60 * 1000);     // 予定は5分ごとに取り直す
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
